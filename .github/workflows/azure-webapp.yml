name: Build and deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore CloudAgentWebApp.csproj
      - name: Build
        run: dotnet build CloudAgentWebApp.csproj --configuration Release --no-restore
      - name: Check formatting
        run: dotnet format CloudAgentWebApp.csproj --verify-no-changes --no-restore
      - name: Publish
        run: dotnet publish CloudAgentWebApp.csproj --configuration Release --no-build --output ./publish
      - name: Upload app
        uses: actions/upload-artifact@v7.0.2
        with:
          name: webapp
          path: ./publish
          if-no-files-found: error

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: azure-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check Azure configuration
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          : "${AZURE_CLIENT_ID:?Set the AZURE_CLIENT_ID environment variable in GitHub}"
          : "${AZURE_TENANT_ID:?Set the AZURE_TENANT_ID environment variable in GitHub}"
          : "${AZURE_SUBSCRIPTION_ID:?Set the AZURE_SUBSCRIPTION_ID environment variable in GitHub}"
          : "${AZURE_WEBAPP_NAME:?Set the AZURE_WEBAPP_NAME environment variable in GitHub}"
      - name: Download app
        uses: actions/download-artifact@v8.0.2
        with:
          name: webapp
          path: ./publish
      - name: Sign in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy app
        uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
          startup-command: dotnet CloudAgentWebApp.dll
